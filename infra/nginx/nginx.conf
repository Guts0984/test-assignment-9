# Reverse proxy in front of the web app and the API: one origin for the browser (cookies and SSE
# just work), a first rate-limit layer, and hard limits on slow or oversized requests.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Docker's embedded DNS: upstreams are resolved per request, so nginx starts even if one is down.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # ---- logging: no query strings, cookies or bodies ----
  log_format main '$remote_addr "$request_method $uri" $status $request_time $upstream_response_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  # ---- limits per client IP (the key is the real peer address, never a client-sent header) ----
  # Many devices (tablets, phones) can sit behind ONE address (the restaurant's NAT), so the general
  # limit is generous: it stops floods, not busy shifts. Static assets get their own, larger bucket
  # because a single page load fetches a dozen files.
  limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=static:10m rate=300r/s;
  # Login: a whole shift may sign in from one NAT address; brute force on ONE account is stopped by
  # the API (5 attempts per address+username), this only limits sheer volume.
  limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # ---- slow-client (slowloris) and size protection ----
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 15s;
  reset_timedout_connection on;
  client_max_body_size 128k;
  client_header_buffer_size 2k;
  large_client_header_buffers 4 8k;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  server {
    listen 80;
    server_name _;

    limit_req zone=general burst=120 nodelay;
    limit_conn perip 60;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Errors produced by nginx itself use the API's JSON envelope.
    error_page 429 = @rate_limited;
    error_page 413 = @too_large;
    error_page 502 503 504 = @unavailable;
    location @rate_limited {
      internal;
      default_type application/json;
      add_header Retry-After 2 always;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests","requestId":"nginx"}}';
    }
    location @too_large {
      internal;
      default_type application/json;
      return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large","requestId":"nginx"}}';
    }
    location @unavailable {
      internal;
      default_type application/json;
      return 503 '{"error":{"code":"INTERNAL","message":"Service temporarily unavailable","requestId":"nginx"}}';
    }

    # ---- API: /api/* → api:4000/* ---------------------------------------------------------------
    # X-Forwarded-For is OVERWRITTEN with the real peer, never appended to a client-supplied chain,
    # so the API's trusted-proxy logic can't be fooled by a forged header.
    set $api_upstream http://api:4000;
    set $web_upstream http://web:3000;

    location = /api/auth/login {
      limit_req zone=login burst=15 nodelay;
      limit_req zone=general burst=120 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api_upstream;
      include /etc/nginx/proxy_params;
    }

    # Server-sent events: never buffer, never time out while idle (the API sends heartbeats).
    location = /api/events {
      limit_conn perip 12;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api_upstream;
      include /etc/nginx/proxy_params;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      chunked_transfer_encoding off;
      add_header X-Accel-Buffering "no" always;
    }

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api_upstream;
      include /etc/nginx/proxy_params;
    }

    # Swagger UI uses absolute asset paths, so it is exposed at its own path.
    location /docs {
      proxy_pass $api_upstream;
      include /etc/nginx/proxy_params;
    }
    location = /docs-json {
      proxy_pass $api_upstream;
      include /etc/nginx/proxy_params;
    }

    # Hashed, immutable build assets: cheap to serve, fetched in bursts of a dozen files per page.
    location /_next/ {
      limit_req zone=static burst=600 nodelay;
      proxy_pass $web_upstream;
      include /etc/nginx/proxy_params;
    }

    # ---- everything else: the Next.js app ---------------------------------------------------------
    location / {
      proxy_pass $web_upstream;
      include /etc/nginx/proxy_params;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Only methods the app uses.
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|DELETE|OPTIONS)$) {
      return 405;
    }
  }
}
