name: restaurant

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Local only: lets tests on the host reach the database.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot job: apply migrations, then seed if the database is empty.
  db-init:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RESTAURANT_TZ: ${RESTAURANT_TZ:-Europe/Kyiv}
      SEED_WAITER_PASSWORD: ${SEED_WAITER_PASSWORD}
      SEED_COOK_PASSWORD: ${SEED_COOK_PASSWORD}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD}
      SEED_RESET: ${SEED_RESET:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${API_PORT:-4000}
      RESTAURANT_TZ: ${RESTAURANT_TZ:-Europe/Kyiv}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:8080,http://localhost:3000}
      # Only nginx (fixed address below) may set the client IP via X-Forwarded-For.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.0.10}
      BODY_LIMIT_KB: ${BODY_LIMIT_KB:-64}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_GLOBAL_BURST: ${RATE_LIMIT_GLOBAL_BURST:-120}
      RATE_LIMIT_GLOBAL_PER_SEC: ${RATE_LIMIT_GLOBAL_PER_SEC:-30}
      RATE_LIMIT_LOGIN_IP_BURST: ${RATE_LIMIT_LOGIN_IP_BURST:-10}
      RATE_LIMIT_LOGIN_IP_PER_MIN: ${RATE_LIMIT_LOGIN_IP_PER_MIN:-10}
      RATE_LIMIT_LOGIN_USER_BURST: ${RATE_LIMIT_LOGIN_USER_BURST:-5}
      RATE_LIMIT_LOGIN_USER_PER_MIN: ${RATE_LIMIT_LOGIN_USER_PER_MIN:-5}
      LOGIN_MAX_CONCURRENCY: ${LOGIN_MAX_CONCURRENCY:-4}
      SSE_MAX_PER_IP: ${SSE_MAX_PER_IP:-10}
      SSE_MAX_PER_USER: ${SSE_MAX_PER_USER:-5}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    # Not published: the only way in is nginx.
    expose:
      - '4000'

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-8080}:80'
    networks:
      default:
        ipv4_address: 172.30.0.10

  # Black-box tests against the whole stack, run from INSIDE the compose network with several
  # source addresses (so nginx and the API see genuinely different clients):
  #   docker compose --profile test run --rm stack-tests
  stack-tests:
    profiles: ['test']
    build:
      context: .
      dockerfile: infra/stack-tests/Dockerfile
    cap_add:
      - NET_ADMIN
    environment:
      STACK_URL: http://nginx
      SEED_WAITER_PASSWORD: ${SEED_WAITER_PASSWORD}
      SEED_COOK_PASSWORD: ${SEED_COOK_PASSWORD}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD}
    depends_on:
      nginx:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
